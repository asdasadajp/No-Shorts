<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Your Time from Shorts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      background: #ffffff;
    }

    .container {
      padding: 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #666;
    }

    .toggle-section {
      margin-bottom: 20px;
    }

    .toggle-buttons {
      display: flex;
      gap: 8px;
      background: #f5f5f5;
      padding: 4px;
      border-radius: 12px;
    }

    .toggle-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
      color: #666;
    }

    .toggle-btn:hover {
      background: #e8e8e8;
    }

    .toggle-btn.active {
      background: #4CAF50;
      color: white;
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    }

    .toggle-btn.active.show {
      background: #9e9e9e;
      box-shadow: 0 2px 8px rgba(158, 158, 158, 0.3);
    }

    .status {
      text-align: center;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 12px;
      margin-top: 16px;
    }

    .status-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 14px;
      color: #333;
      font-weight: 500;
    }

    .status-desc {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .version {
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⏱️</div>
      <div class="title">Save Your Time from Shorts</div>
      <div class="subtitle">v1.1</div>
    </div>

    <div class="toggle-section">
      <div class="toggle-buttons">
        <button class="toggle-btn active" id="hideBtn">
          非表示
        </button>
        <button class="toggle-btn" id="showBtn">
          表示
        </button>
      </div>
    </div>

    <div class="status" id="status">
      <div class="status-icon">✅</div>
      <div class="status-text">Shortsを非表示中</div>
      <div class="status-desc">時間を有効活用できています</div>
    </div>

    <div class="footer">
      <div class="version">Save Your Time from Shorts 1.1</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
